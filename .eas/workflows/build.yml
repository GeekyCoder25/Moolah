name: Build

# TEMPORARY — SUBMIT ONLY (no build).
# The Android build already succeeded; only the Google Play submit needs setting
# up. To iterate on that WITHOUT burning build quota, this workflow submits an
# EXISTING build instead of building a new one.
#
# How to run it:
#   Expo dashboard → Workflows → Build → "Run workflow", and paste the id of the
#   successful Android build. Find the id at expo.dev → your project → Builds →
#   open the green Android 1.0.3 (6) build (last path segment of the URL), or run
#   `eas build:list --platform android --limit 1`.
#
# Restore the full build + submit workflow (both platforms + `build-*` tag
# trigger) from git history once the Android submit works.
on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
        description: EAS build id of the successful Android build to submit to Google Play

jobs:
  submit_android:
    name: Submit Android to Google Play
    type: submit
    params:
      build_id: ${{ github.event.inputs.build_id }}
      profile: production
    env:
      EXPO_DEBUG: '1'
