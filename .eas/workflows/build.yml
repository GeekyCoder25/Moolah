name: Build

on:
  push:
    branches: []
    tags:
      - build-*
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS App
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit iOS to TestFlight
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
    env:
      EXPO_DEBUG: '1'

  build_android:
    name: Build Android AAB
    type: build
    params:
      platform: android
      profile: production
