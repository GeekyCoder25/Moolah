name: Build

# TEMPORARY — SUBMIT ONLY (no build).
# The iOS build already succeeded; only the TestFlight submit is failing on the
# submission/credential config. To iterate on that WITHOUT burning build quota,
# this workflow submits an EXISTING build instead of building a new one.
#
# How to run it:
#   Expo dashboard → Workflows → Build → "Run workflow", and paste the id of the
#   successful iOS build. Find the id at expo.dev → your project → Builds → open
#   the green iOS 1.0.3 (6) build (it's the last path segment of the URL), or run
#   `eas build:list --platform ios --limit 1`.
#
# Restore the build+submit version (the build_ios job + `build-*` tag trigger)
# from git history once submission works.
on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
        description: EAS build id of the successful iOS build to submit to TestFlight

jobs:
  submit_ios:
    name: Submit iOS to TestFlight
    type: submit
    params:
      build_id: ${{ github.event.inputs.build_id }}
      profile: production
    env:
      EXPO_DEBUG: '1'
